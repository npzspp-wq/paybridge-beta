<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYBRIDGE Beta</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7faff;color:#0c1830}.shell{max-width:1240px;margin:auto;padding:0 28px}.hero{text-align:center;padding:28px 0 18px}.hero h1{font-size:48px;margin:14px auto 10px;max-width:820px}.calculator{background:#fff;border:1px solid #dce5f1;border-radius:20px;padding:18px}.form{display:grid;grid-template-columns:1.15fr 1.15fr .9fr .9fr auto;gap:11px;align-items:end}.field label{display:block;font-size:10px;font-weight:800;color:#75839a;margin:0 0 6px 3px}.selectWrap{position:relative}.flag{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:15px;border-radius:2px;box-shadow:0 0 0 1px #0002;z-index:2;overflow:hidden}.flag.de{background:linear-gradient(#111 0 33%,#d71920 33% 66%,#ffcf23 66%)}.flag.fr{background:linear-gradient(90deg,#0055a4 0 33%,#fff 33% 66%,#ef4135 66%)}.flag.nl{background:linear-gradient(#ae1c28 0 33%,#fff 33% 66%,#21468b 66%)}.flag.es{background:linear-gradient(#aa151b 0 25%,#f1bf00 25% 75%,#aa151b 75%)}.flag.it{background:linear-gradient(90deg,#009246 0 33%,#fff 33% 66%,#ce2b37 66%)}.flag.ae{background:linear-gradient(90deg,#d71920 0 27%,transparent 27%),linear-gradient(#159447 0 33%,#fff 33% 66%,#111 66%)}.flag.tr{background:#e30a17}.flag.sg{background:linear-gradient(#ef3340 0 50%,#fff 50%)}.flag.gb{background:#21468b}.control{height:50px;width:100%;border:1px solid #ccd8e8;border-radius:12px;background:#fbfdff;padding:0 12px;font-size:14px}.selectWrap .control{padding-left:44px}.compare{height:50px;border:0;border-radius:12px;padding:0 20px;background:#2463eb;color:#fff;font-weight:900}.note{grid-column:1/-1;font-size:11px;color:#66758f}.results{padding:26px 0}.resultHead{display:flex;justify-content:space-between;align-items:center}.route{background:#eef4ff;border-radius:11px;padding:9px 12px;font-weight:800;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.provider{background:#fff;border:1px solid #dce5f1;border-radius:17px;padding:17px;box-shadow:0 10px 28px #1b3b6f0d}.provider.best{border:2px solid #2463eb;background:linear-gradient(180deg,#fff,#f8fbff)}.top{display:flex;justify-content:space-between;align-items:center}.badge{font-size:9px;font-weight:900;color:#1746b6;background:#eaf2ff;padding:5px 7px;border-radius:999px}.demo{font-size:9px;font-weight:900;color:#66758f;border:1px solid #dce5f1;padding:5px 7px;border-radius:999px}.provider h3{font-size:25px;margin:12px 0 2px}.type{font-size:12px;color:#66758f}.recipient{margin:11px 0;padding:12px;background:#edf5ff;border-radius:12px}.recipient small{color:#66758f}.recipient strong{font-size:30px;color:#123b88}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{padding:8px;background:#f5f8fc;border-radius:9px}.warning{margin-top:12px;background:#fff9ef;padding:10px;border-radius:10px;font-size:11px}@media(max-width:900px){.form,.grid{grid-template-columns:1fr}.hero h1{font-size:36px}}</style></head><body><div class="shell"><section class="hero"><h1>Compare international payment routes before you send.</h1><p>See estimated cost, recipient amount, speed and route type in one clear business view.</p></section><section class="calculator"><form id="f" class="form"><div class="field"><label>FROM</label><div class="selectWrap"><span id="fromFlag" class="flag de"></span><select id="from" class="control"><option value="DE">Germany</option><option value="FR">France</option><option value="NL">Netherlands</option><option value="ES">Spain</option><option value="IT">Italy</option></select></div></div><div class="field"><label>TO</label><div class="selectWrap"><span id="toFlag" class="flag ae"></span><select id="to" class="control"><option value="AED">United Arab Emirates</option><option value="TRY">Turkey</option><option value="SGD">Singapore</option><option value="GBP">United Kingdom</option></select></div></div><div class="field"><label>YOU SEND, EUR</label><input id="amount" class="control" type="number" value="25000"></div><div class="field"><label>RECIPIENT CURRENCY</label><select id="cur" class="control"><option>AED</option><option>TRY</option><option>SGD</option><option>GBP</option></select></div><button class="compare">COMPARE</button><div class="note"><b>Beta mode:</b> simulated comparison data — not live quotes.</div></form></section><section id="results" class="results" hidden><div class="resultHead"><h2>Best routes for this payment</h2><div id="route" class="route"></div></div><div id="cards" class="grid"></div><div class="warning">Prototype only. PAYBRIDGE does not initiate or hold funds.</div></section></div><script>const from=document.getElementById('from'),to=document.getElementById('to'),cur=document.getElementById('cur'),fromFlag=document.getElementById('fromFlag'),toFlag=document.getElementById('toFlag'),results=document.getElementById('results'),cards=document.getElementById('cards');const fromFlags={DE:'de',FR:'fr',NL:'nl',ES:'es',IT:'it'},toFlags={AED:'ae',TRY:'tr',SGD:'sg',GBP:'gb'},fx={AED:4.15,TRY:47.2,SGD:1.49,GBP:.86};const providers=[['Wise','Fiat transfer',.006,'1 business day','BEST VALUE'],['Airwallex','Business fintech',.008,'Same day','FAST'],['CoinGate','Stablecoin route',.01,'Minutes','STABLECOIN']];from.onchange=()=>fromFlag.className='flag '+fromFlags[from.value];to.onchange=()=>{cur.value=to.value;toFlag.className='flag '+toFlags[to.value]};document.getElementById('f').onsubmit=e=>{e.preventDefault();const amount=+document.getElementById('amount').value,c=cur.value,rate=fx[c]||1;document.getElementById('route').textContent=from.selectedOptions[0].text+' → '+to.selectedOptions[0].text+' • €'+amount.toLocaleString()+' → '+c;cards.innerHTML=providers.map((p,i)=>{const cost=amount*p[2],rec=(amount-cost)*rate;return '<article class="provider '+(i===0?'best':'')+'"><div class="top"><span class="badge">'+p[4]+'</span><span class="demo">DEMO</span></div><h3>'+p[0]+'</h3><div class="type">'+p[1]+'</div><div class="recipient"><small>Recipient gets</small><br><strong>'+rec.toLocaleString(undefined,{maximumFractionDigits:0})+' '+c+'</strong></div><div class="metrics"><div class="metric">Cost<br><b>€'+cost.toFixed(0)+'</b></div><div class="metric">Speed<br><b>'+p[3]+'</b></div></div></article>'}).join('');results.hidden=false};</script></body></html>
