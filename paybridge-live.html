<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYBRIDGE Live FX Beta</title><style>body{font-family:Arial,sans-serif;background:#f7faff;color:#0c1830;margin:0}.wrap{max-width:900px;margin:auto;padding:28px}.box{background:#fff;border:1px solid #dce5f1;border-radius:18px;padding:20px}h1{font-size:34px}.row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}.c{height:48px;border:1px solid #ccd8e8;border-radius:10px;padding:0 12px}.b{border:0;border-radius:10px;background:#2463eb;color:#fff;font-weight:800;padding:0 18px}.status{margin-top:14px;padding:12px;background:#eef4ff;border-radius:10px}.result{margin-top:14px;font-size:26px;font-weight:800}.note{margin-top:12px;font-size:12px;color:#66758f}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>PAYBRIDGE — Reference FX test</h1><div class="box"><div class="row"><select id="to" class="c"><option value="AED">🇦🇪 United Arab Emirates — AED</option><option value="TRY">🇹🇷 Turkey — TRY</option><option value="SGD">🇸🇬 Singapore — SGD</option><option value="GBP">🇬🇧 United Kingdom — GBP</option></select><input id="amount" class="c" type="number" value="25000"><input class="c" value="EUR" disabled><button id="go" class="b">GET RATE</button></div><div id="status" class="status">Ready to request EUR reference FX.</div><div id="result" class="result"></div><div class="note">Reference FX only. No provider quote, payment or transfer is initiated. If reference data is unavailable, the page clearly marks the fallback as DEMO.</div></div></div><script src="reference-fx.js"></script><script>document.getElementById('go').onclick=async function(){var code=document.getElementById('to').value,amount=Number(document.getElementById('amount').value||0),s=document.getElementById('status'),r=document.getElementById('result');this.disabled=true;this.textContent='LOADING…';var q=await PaybridgeReferenceRate.get(code);s.textContent=q.reference?'Reference FX: 1 EUR = '+q.rate+' '+code+(q.date?' • '+q.date:''):'Reference FX unavailable — DEMO fallback rate';r.textContent='€'+amount.toLocaleString()+' ≈ '+(amount*q.rate).toLocaleString(undefined,{maximumFractionDigits:2})+' '+code;this.disabled=false;this.textContent='GET RATE'};</script></body></html>
